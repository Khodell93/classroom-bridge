name: Build Mac companion

on:
  workflow_dispatch:
  push:
    paths:
      - "pc-companion/**"
      - ".github/workflows/build-mac-companion.yml"
      - "installer/**"

permissions:
  contents: read

jobs:
  build:
    name: Build macOS ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    env:
      # Signing and notarisation with an Apple Developer account; skipped until these secrets exist (README "Code signing").
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Apple-Silicon-arm64
            runner: macos-14
          - architecture: Intel-x64
            runner: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install companion and packaging dependencies
        run: python -m pip install -r pc-companion/requirements.txt pyinstaller

      - name: Stamp the build version
        run: git log -1 --format=%ct > pc-companion/version.txt

      - name: Build the Mac application
        working-directory: pc-companion
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name ClassroomBridge
          --icon assets/app.icns
          --add-data assets:assets
          --osx-bundle-identifier com.classroombridge.companion
          --collect-submodules qrcode
          --collect-all aiortc --collect-all av --collect-all aioice
          --collect-all pylibsrtp --collect-all websockets --collect-data certifi
          --collect-all AppKit --collect-all Foundation --collect-all Quartz
          --add-data version.txt:.
          --hidden-import companion_ui --hidden-import update_service
          main.py

      - name: Sign and notarise the app
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          test -n "$identity" || { echo "::error::No Developer ID Application certificate in MACOS_CERTIFICATE"; exit 1; }
          app=pc-companion/dist/ClassroomBridge.app
          # Sign every bundled library first, then the app, with the hardened runtime notarisation requires.
          find "$app/Contents" -type f \( -name "*.so" -o -name "*.dylib" -o -perm -111 \) -print0 \
            | xargs -0 -I{} codesign --force --timestamp --options runtime --entitlements installer/macos-entitlements.plist --sign "$identity" "{}"
          codesign --force --timestamp --options runtime --entitlements installer/macos-entitlements.plist --sign "$identity" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose "$app"

      - name: Prepare download package
        run: |
          mkdir -p package
          cp -R pc-companion/dist/ClassroomBridge.app package/
          cat > package/Start-Here.txt <<'EOF'
          CLASSROOM BRIDGE — MAC COMPANION

          1. Move ClassroomBridge.app into Applications and open it. It connects by itself and,
             from then on, opens automatically when you sign in (you can turn that off in its window).
             Closing the window keeps it running; click its Dock icon to open it again, or press
             Command-Q to quit.
          2. On first use, allow Screen Recording and Accessibility when macOS asks.
             If prompted, open System Settings > Privacy & Security and enable the app
             under Screen Recording and Accessibility, then quit and reopen it.
          3. On the iPad, open Classroom Bridge, tap the gear, then Scan QR code and point it at the
             QR code in the companion window (or type the code shown).
          4. Leave the companion open while teaching; choose Stop when finished.

          Apple Pencil annotations on the iPad are mirrored in a click-through
          overlay on the Mac display. Use Clear ink in the iPad tools to remove them.

          The app streams and controls this Mac's desktop after a paired iPad connects.
          This build is not signed or notarized. Distribute only through school-approved
          channels. If macOS or school security blocks it, ask school IT to review and
          approve the app; do not bypass security controls.
          EOF
          ditto -c -k --sequesterRsrc --keepParent package/ClassroomBridge.app ClassroomBridge-macOS-${{ matrix.architecture }}.zip
          cp package/Start-Here.txt ClassroomBridge-macOS-Start-Here.txt

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClassroomBridge-macOS-${{ matrix.architecture }}
          path: |
            ClassroomBridge-macOS-${{ matrix.architecture }}.zip
            ClassroomBridge-macOS-Start-Here.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the public downloads page
        if: github.ref_name == 'main' || github.ref_name == 'claude/laughing-ramanujan-d8p3l8'
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
        run: bash pc-companion/publish_release.sh ClassroomBridge-macOS-${{ matrix.architecture }}.zip ClassroomBridge-macOS-Start-Here.txt
