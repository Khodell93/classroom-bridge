name: Build Windows companion

on:
  workflow_dispatch:
  push:
    paths:
      - "pc-companion/**"
      - "installer/**"
      - ".github/workflows/build-windows-companion.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # Code signing (Microsoft Trusted Signing / Azure Artifact Signing). Every signing step is skipped until
      # these repository secrets exist — see README "Code signing".
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SIGNING_ENDPOINT: ${{ secrets.SIGNING_ENDPOINT }}
      SIGNING_ACCOUNT: ${{ secrets.SIGNING_ACCOUNT }}
      SIGNING_PROFILE: ${{ secrets.SIGNING_PROFILE }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install companion and packaging dependencies
        run: python -m pip install -r pc-companion/requirements.txt pyinstaller

      - name: Stamp the build version
        shell: bash
        run: git log -1 --format=%ct > pc-companion/version.txt

      - name: Check the update helper
        run: python pc-companion/test_windows_update.py

      - name: Check the Bluetooth beacon fails gracefully without an adapter
        working-directory: pc-companion
        run: python -c "import airplay_beacon as b; print(b.advert_bytes('10.0.0.5', 7000).hex()); print('Beacon:', b.Beacon().start(b.local_ipv4(), 7000) or 'advertising')"

      - name: Build the teacher-facing application
        working-directory: pc-companion
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ClassroomBridge
          --icon assets/app.ico
          --add-data assets:assets
          --add-data version.txt:.
          --hidden-import pystray._win32
          --collect-all winrt --hidden-import airplay_beacon
          --collect-submodules qrcode
          --collect-all aiortc --collect-all av --collect-all aioice
          --collect-all pylibsrtp --collect-all websockets --collect-data certifi
          --hidden-import companion_ui --hidden-import update_service
          main.py

      - name: Set up MSYS2 for the AirPlay receiver
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-openssl mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-gstreamer mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-nasm make diffutils

      # UxPlay 1.74 (development branch) has a built-in mDNS responder, so Windows needs no Apple Bonjour.
      - name: Build UxPlay AirPlay receiver
        shell: msys2 {0}
        env:
          UXPLAY_COMMIT: a3c064d9111c67a3fc35d5d1e7fbced8712f649a
        run: |
          git clone https://github.com/FDH2/UxPlay uxplay-src
          git -C uxplay-src checkout "$UXPLAY_COMMIT"
          # NO_MARCH_NATIVE: UxPlay otherwise compiles for the build machine's own CPU (-march=native), and the
          # receiver then crashes with 0xC000001D (illegal instruction) on school PCs with older processors.
          cmake -S uxplay-src -B uxplay-src/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNO_MARCH_NATIVE=ON | tee cmake.log
          if grep -q "Using CFLAGS with  -march=native" cmake.log; then echo "::error::UxPlay would be built for this machine's CPU only"; exit 1; fi
          cmake --build uxplay-src/build

      - name: Build the video decoder plugin against a minimal FFmpeg
        shell: msys2 {0}
        run: bash pc-companion/build_minimal_libav.sh libav-build

      - name: Bundle the AirPlay receiver
        shell: msys2 {0}
        run: bash pc-companion/bundle_airplay.sh uxplay-src package/airplay libav-build

      - name: Check the receiver needs nothing beyond standard Windows
        run: |
          python -m pip install pefile
          python pc-companion/check_airplay_dependencies.py package/airplay

      - name: Check the receiver starts with the companion's settings, even with a stale plugin cache
        run: python pc-companion/test_airplay_receiver.py package/airplay

      - name: Check the bundled receiver runs without MSYS2
        shell: pwsh
        run: |
          $airplay = Resolve-Path package/airplay
          $env:PATH = "$airplay;C:\Windows\System32;C:\Windows"
          $env:GST_PLUGIN_PATH = "$airplay\lib\gstreamer-1.0"
          $env:GST_PLUGIN_SYSTEM_PATH_1_0 = "$airplay\lib\gstreamer-1.0"
          $env:GST_PLUGIN_SCANNER = "$airplay\libexec\gstreamer-1.0\gst-plugin-scanner.exe"
          $env:GST_REGISTRY_1_0 = "$env:RUNNER_TEMP\gst-registry.bin"
          foreach ($element in "appsrc","queue","h264parse","decodebin","avdec_h264","videoconvert","videoflip","d3d11videosink","aacparse","avdec_aac","avdec_alac","audioconvert","audioresample","volume","autoaudiosink") {
            & "$airplay\gst-inspect-1.0.exe" --exists $element
            if ($LASTEXITCODE -ne 0) { throw "Bundled GStreamer is missing $element" }
          }
          $receiver = Start-Process "$airplay\uxplay.exe" -ArgumentList "-n",'"Classroom Bridge - CI"',"-nh","-pin","1234","-reg","$env:RUNNER_TEMP\reg.txt","-p","-fs","-vs","d3d11videosink" -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\uxplay.log" -RedirectStandardError "$env:RUNNER_TEMP\uxplay.err"
          Start-Sleep -Seconds 10
          Get-Content "$env:RUNNER_TEMP\uxplay.log", "$env:RUNNER_TEMP\uxplay.err"
          if ($receiver.HasExited) { throw "uxplay.exe exited during start-up (code $($receiver.ExitCode))" }
          Stop-Process -Id $receiver.Id
          "Bundle size: {0:N0} MB" -f ((Get-ChildItem $airplay -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Sign the programs
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\pc-companion\dist\ClassroomBridge.exe
            ${{ github.workspace }}\package\airplay\uxplay.exe
          file-digest: SHA256
          timestamp-digest: SHA256
          description: Classroom Bridge

      - name: Prepare download package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item pc-companion/dist/ClassroomBridge.exe package/
          $quickStart = @'
          CLASSROOM BRIDGE — WINDOWS COMPANION

          1. Open ClassroomBridge.exe on the school PC. It connects by itself and, from then on,
             opens automatically when you sign in (you can turn that off in its window).
          2. On the iPad, open Classroom Bridge, tap the gear, then Scan QR code and point the
             iPad at the QR code in the companion window (or type the code shown).
          3. Closing the window keeps it running in the system tray near the clock. Use Quit there
             to stop it completely.
          4. Updates install automatically when no iPad is connected (untick the box in the window
             to update only with the Update button).

          Apple Pencil annotations on the iPad are mirrored in a click-through overlay on the PC
          display. Use Clear ink in the iPad tools to remove them.

          iPad apps (OneDrive, PowerPoint, PDFs): keep ClassroomBridge.exe next to the "airplay"
          folder. On the iPad, open Control Centre, tap Screen Mirroring and choose
          "Classroom Bridge - <PC name>". The first time, enter the PIN shown in the companion window.
          Windows may ask once to allow the receiver through the firewall (school IT may need to approve).
          The iPad and PC must be on the same school network, as with an Apple TV.

          For school IT: ClassroomBridge-Windows-x64.msi installs for all users, adds the firewall
          rules and opens at sign-in. Silent install: msiexec /i ClassroomBridge-Windows-x64.msi /qn
          (add AUTOSTART=0 to skip opening at sign-in). It keeps itself up to date with a scheduled task
          while the companion is closed; add AUTOUPDATE=0 to deploy updates yourself instead.

          The app captures and controls the signed-in Windows desktop after a paired iPad connects.
          Use only on a school-approved PC. If Windows or school security blocks the app,
          ask school IT to review and approve it; do not bypass those controls.
          '@
          $quickStart | Set-Content package/Start-Here.txt
          Compress-Archive -Path package/* -DestinationPath ClassroomBridge-Windows-x64.zip

      - name: Build the MSI installer
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Firewall.wixext/5.0.2
          # MSI versions are major.minor.build with build < 65536: 1.<year>.<ten-minute slot in the year>.
          $time = [DateTimeOffset]::FromUnixTimeSeconds([int64](Get-Content pc-companion/version.txt)).UtcDateTime
          $slot = [int][Math]::Floor(($time - [datetime]::new($time.Year, 1, 1)).TotalMinutes / 10)
          $version = "1.$($time.Year - 2000).$slot"
          "MSI version $version"
          python installer/harvest_airplay.py package/airplay installer/airplay-files.wxs
          wix build installer/ClassroomBridge.wxs installer/airplay-files.wxs -arch x64 -ext WixToolset.Firewall.wixext `
            -d Version=$version -d SourceDir=package -d AssetsDir=pc-companion/assets `
            -o ClassroomBridge-Windows-x64.msi
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }
          # A copy with a higher version, used only by the automatic-update check below (never published).
          $nextVersion = "1.$($time.Year - 2000).$($slot + 1)"
          wix build installer/ClassroomBridge.wxs installer/airplay-files.wxs -arch x64 -ext WixToolset.Firewall.wixext `
            -d Version=$nextVersion -d SourceDir=package -d AssetsDir=pc-companion/assets `
            -o "$env:RUNNER_TEMP\upgrade-test.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix build (upgrade test) failed" }
          "MSI_VERSION=$version" >> $env:GITHUB_ENV
          "NEXT_MSI_VERSION=$nextVersion" >> $env:GITHUB_ENV

      - name: Sign the installer
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\ClassroomBridge-Windows-x64.msi
          file-digest: SHA256
          timestamp-digest: SHA256
          description: Classroom Bridge

      - name: Check the installer installs and uninstalls cleanly
        shell: pwsh
        run: |
          $msi = Resolve-Path ClassroomBridge-Windows-x64.msi
          $install = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 60; throw "Install failed ($($install.ExitCode))" }
          $folder = "$env:ProgramFiles\Classroom Bridge"
          foreach ($path in "ClassroomBridge.exe", "airplay\uxplay.exe", "airplay\gst-inspect-1.0.exe", "airplay\libexec\gstreamer-1.0\gst-plugin-scanner.exe", "airplay\licenses\UxPlay-LICENSE.txt") {
            if (-not (Test-Path "$folder\$path")) { throw "Missing after install: $path" }
          }
          # Every file of the receiver bundle must be installed in the same place, and the receiver must work there.
          $bundled = (Get-ChildItem package\airplay -Recurse -File).Count
          $installed = (Get-ChildItem "$folder\airplay" -Recurse -File).Count
          "Receiver files: $bundled bundled, $installed installed"
          if ($installed -ne $bundled) { throw "Installed receiver has $installed files, expected $bundled" }
          $env:PATH = "$folder\airplay;C:\Windows\System32;C:\Windows"
          $env:GST_PLUGIN_PATH = "$folder\airplay\lib\gstreamer-1.0"
          $env:GST_PLUGIN_SYSTEM_PATH_1_0 = "$folder\airplay\lib\gstreamer-1.0"
          $env:GST_PLUGIN_SCANNER = "$folder\airplay\libexec\gstreamer-1.0\gst-plugin-scanner.exe"
          $env:GST_REGISTRY_1_0 = "$env:RUNNER_TEMP\gst-registry-installed.bin"
          & "$folder\airplay\gst-inspect-1.0.exe" --exists d3d11videosink
          if ($LASTEXITCODE -ne 0) { throw "Installed receiver can't find its video output plugin" }
          $run = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Run" -Name ClassroomBridge -ErrorAction SilentlyContinue
          if (-not $run) { throw "Sign-in start entry missing" }
          "Starts at sign-in: $($run.ClassroomBridge)"
          $rules = Get-NetFirewallRule -DisplayName "Classroom Bridge AirPlay*" -ErrorAction SilentlyContinue
          if ($rules.Count -lt 2) { throw "Firewall rules missing" }
          $rules | Format-Table DisplayName, Enabled, Direction, Action -AutoSize
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Classroom Bridge.lnk")) { throw "Start menu shortcut missing" }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut("$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Classroom Bridge.lnk")
          "Start menu shortcut: $($link.TargetPath) (icon: $($link.IconLocation))"
          if ($link.TargetPath -ne "$folder\ClassroomBridge.exe") { throw "The Start menu shortcut should point straight at ClassroomBridge.exe (so its icon comes from the app)" }

          # Automatic updates: the installer registers the updater task, and running it checks the downloads page.
          if (-not (Get-ScheduledTask -TaskName "Classroom Bridge Updater" -ErrorAction SilentlyContinue)) { throw "Updater task missing" }
          (Get-ScheduledTask -TaskName "Classroom Bridge Updater").Triggers | Format-Table -AutoSize
          Start-ScheduledTask -TaskName "Classroom Bridge Updater"
          $log = "$folder\update.log"
          for ($i = 0; $i -lt 90 -and -not (Select-String -Path $log -Pattern "Up to date|Downloading|failed" -Quiet -ErrorAction SilentlyContinue); $i++) { Start-Sleep 2 }
          Get-Content $log -ErrorAction SilentlyContinue
          if (-not (Select-String -Path $log -Pattern "Up to date|Downloading" -Quiet -ErrorAction SilentlyContinue)) { throw "The updater task did not check for updates" }

          # A teacher (standard account) can start the updater task: the companion's "Update now".
          $password = ConvertTo-SecureString "Cb-$(Get-Random)-Aa1!" -AsPlainText -Force
          New-LocalUser -Name cbteacher -Password $password -PasswordNeverExpires | Out-Null
          $teacher = New-Object System.Management.Automation.PSCredential("cbteacher", $password)
          $before = @(Get-Content $log).Count
          $run = Start-Process schtasks.exe -ArgumentList '/Run /TN "Classroom Bridge Updater"' -Credential $teacher -WorkingDirectory $env:SystemRoot -WindowStyle Hidden -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "A standard user could not start the updater task (exit $($run.ExitCode))" }
          for ($i = 0; $i -lt 60 -and @(Get-Content $log).Count -le $before; $i++) { Start-Sleep 2 }
          Get-Content $log | Select-Object -Skip $before
          if (@(Get-Content $log).Count -le $before) { throw "The updater task started by a teacher did not run" }

          # Only one companion: the installed copy closes a downloaded copy that is already running.
          $zipCopy = "$env:RUNNER_TEMP\zip-copy"
          Copy-Item package $zipCopy -Recurse
          Start-Process "$zipCopy\ClassroomBridge.exe" -ArgumentList "--background"
          Start-Sleep 15
          $copies = @(Get-Process ClassroomBridge -ErrorAction SilentlyContinue | Where-Object Path -like "$zipCopy*")
          "Downloaded copy processes before: $($copies.Count)"
          if (-not $copies) { throw "The downloaded copy didn't start" }
          Start-Process "$folder\ClassroomBridge.exe" -ArgumentList "--background"
          Start-Sleep 15
          $left = @(Get-Process ClassroomBridge -ErrorAction SilentlyContinue | Where-Object Path -like "$zipCopy*")
          $installed = @(Get-Process ClassroomBridge -ErrorAction SilentlyContinue | Where-Object Path -like "$folder*")
          "Downloaded copy processes after: $($left.Count); installed copy processes: $($installed.Count)"
          if ($left) { throw "The installed companion did not close the downloaded copy" }
          if (-not $installed) { throw "The installed companion didn't keep running" }
          # Opening it again just shows the running one.
          Start-Process "$folder\ClassroomBridge.exe"
          Start-Sleep 10
          $count = @(Get-Process ClassroomBridge -ErrorAction SilentlyContinue).Count
          "Companion processes after opening it again: $count"
          if ($count -gt 2) { throw "A second companion started" }
          Get-Process ClassroomBridge, uxplay -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3

          # Automatic updates: a scheduled task installing a newer MSI upgrades in place and keeps the updater.
          $action = New-ScheduledTaskAction -Execute "$folder\ClassroomBridge.exe" -Argument "--update-service --from-file `"$env:RUNNER_TEMP\upgrade-test.msi`""
          Register-ScheduledTask -TaskName "Classroom Bridge upgrade test" -Action $action -User "SYSTEM" -RunLevel Highest -Force | Out-Null
          Start-ScheduledTask -TaskName "Classroom Bridge upgrade test"
          $installedVersion = ""
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep 2
            $entry = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object DisplayName -eq "Classroom Bridge"
            $installedVersion = "$($entry.DisplayVersion)"
            $installing = Get-CimInstance Win32_Process -Filter "Name = 'msiexec.exe'" | Where-Object CommandLine -like "*upgrade-test.msi*"
            if ($installedVersion -eq $env:NEXT_MSI_VERSION -and -not $installing) { break }
          }
          Unregister-ScheduledTask -TaskName "Classroom Bridge upgrade test" -Confirm:$false
          Start-Sleep 10
          Get-Content $log -ErrorAction SilentlyContinue
          if ($installedVersion -ne $env:NEXT_MSI_VERSION) {
            Get-Content "$folder\update-install.log" -Tail 80 -ErrorAction SilentlyContinue
            throw "Automatic update did not install version $env:NEXT_MSI_VERSION (installed: $installedVersion)"
          }
          "Upgraded by the update task: $env:MSI_VERSION -> $installedVersion"
          if (-not (Test-Path "$folder\ClassroomBridge.exe")) { throw "App missing after automatic update" }
          if (-not (Get-ScheduledTask -TaskName "Classroom Bridge Updater" -ErrorAction SilentlyContinue)) { throw "Updater task missing after automatic update" }
          if ((Get-ItemProperty "HKLM:\Software\Classroom Bridge").AutoUpdate -ne "1") { throw "AutoUpdate setting not kept" }
          $msi = "$env:RUNNER_TEMP\upgrade-test.msi"
          $remove = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstall failed ($($remove.ExitCode))" }
          if (Test-Path "$folder\ClassroomBridge.exe") { throw "Files left after uninstall" }
          if (Get-NetFirewallRule -DisplayName "Classroom Bridge AirPlay*" -ErrorAction SilentlyContinue) { throw "Firewall rules left after uninstall" }
          if (Get-ScheduledTask -TaskName "Classroom Bridge Updater" -ErrorAction SilentlyContinue) { throw "Updater task left after uninstall" }
          "Installer checks passed"

      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassroomBridge-Windows-x64
          path: |
            ClassroomBridge-Windows-x64.zip
            ClassroomBridge-Windows-x64.msi
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the public downloads page
        if: github.ref_name == 'main' || github.ref_name == 'claude/laughing-ramanujan-d8p3l8'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
        run: bash pc-companion/publish_release.sh ClassroomBridge-Windows-x64.zip ClassroomBridge-Windows-x64.msi
