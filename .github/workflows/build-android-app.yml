name: Build Android app

# Builds the Android tablet app (android/): a full-screen wrapper around the web app, so it only needs rebuilding
# when android/ changes. Published to the downloads repository's "android" release at a link that never changes:
# https://github.com/Khodell93/classroom-bridge-downloads/releases/download/android/ClassroomBridge-Android.apk
# Signing needs two repository secrets (see README): ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/laughing-ramanujan-d8p3l8
    paths:
      - "android/**"
      - ".github/workflows/build-android-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build the APK
        working-directory: android
        run: |
          # Each build gets a higher version number (minutes since 1970 at the commit), so tablets accept it as an update.
          export ANDROID_VERSION_CODE=$(( $(git log -1 --format=%ct) / 60 ))
          export ANDROID_VERSION_NAME="1.0.$(TZ=UTC git log -1 --format=%cd --date=format-local:'%Y%m%d.%H%M')"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/classroom-bridge.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/classroom-bridge.keystore"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: this APK is signed with a throwaway key and won't be published."
          fi
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../ClassroomBridge-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ClassroomBridge-Android
          path: ClassroomBridge-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the public downloads page
        if: (github.ref_name == 'main' || github.ref_name == 'claude/laughing-ramanujan-d8p3l8') && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
        run: |
          repo=Khodell93/classroom-bridge-downloads
          if [ -z "$GH_TOKEN" ]; then echo "::warning::DOWNLOADS_TOKEN is not set; skipping publishing."; exit 0; fi
          gh release view android -R "$repo" >/dev/null 2>&1 || gh release create android -R "$repo" --latest=false \
            --title "Classroom Bridge for Android tablets" \
            --notes "Download ClassroomBridge-Android.apk on the tablet and open it to install (allow installing from this source when Android asks). The app shows the Classroom Bridge web app, which updates itself; this file only changes when the app itself does."
          gh release upload android ClassroomBridge-Android.apk -R "$repo" --clobber
          echo "Published https://github.com/$repo/releases/download/android/ClassroomBridge-Android.apk"
